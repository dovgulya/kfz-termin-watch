name: Kfz-Termin Nürnberg

on:
  schedule:
    - cron: "*/5 * * * *"   # каждые 5 минут (GitHub иногда запускает с задержкой)
  workflow_dispatch:
    inputs:
      test:
        description: "Отправить тестовый пуш"
        type: boolean
        default: true

concurrency:
  group: kfz-termin
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4

      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: state
          key: kfz-state-${{ github.run_id }}
          restore-keys: kfz-state-

      - name: Check slots
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TARGET_LAST: "2026-11-27"
          PRIORITY_DAY: "2026-11-20"
          TEST_NOTIFY: ${{ github.event_name == 'workflow_dispatch' && inputs.test && '1' || '0' }}
        run: python3 check.py

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state
          key: kfz-state-${{ github.run_id }}
